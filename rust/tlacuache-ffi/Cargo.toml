[package]
name = "tlacuache-ffi"
description = "Puente UniFFI entre tlacuache-core y la app de Android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
# ADR-A02: core fijado a una etiqueta del repo público.
tlacuache-core = { git = "https://github.com/RicardoMonroy/Tlacuache", tag = "v0.2.3" }
uniffi = "0.32.2"
